name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:

  # ─────────────────────────────────────────────
  # Python services: ai-gateway + recording-worker
  # ─────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - ai-gateway
          - recording-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f "requirements-ci.txt" ]; then
            pip install --no-cache-dir -r requirements-ci.txt
          else
            pip install --no-cache-dir -r requirements.txt
          fi
          pip install ruff pytest

      - name: Lint & Format Check
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest

  # ─────────────────────────────────────────────
  # Frontend: apps/dashboard (Next.js 16 / React 19)
  # ─────────────────────────────────────────────
  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8001/api/v1"

  # ─────────────────────────────────────────────
  # Docker image build for the dashboard
  # Only runs on pushes to main, not on PRs
  # ─────────────────────────────────────────────
  dashboard-docker:
    runs-on: ubuntu-latest
    needs: dashboard
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          push: false
          tags: talkflow-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max