[project]
name = "auth-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
# Alembic's own `alembic revision` template generates these files; leave
# their style alone rather than rewriting migration history for lint.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default is the framework's own required
# pattern, not a bug. BLE001: matches services/ai-gateway's convention.
extend-ignore = ["B008", "BLE001"]
