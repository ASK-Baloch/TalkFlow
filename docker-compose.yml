services:
  ai-gateway:
    build:
      context: ./services/ai-gateway

    container_name: talkflow-ai-gateway

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://talkflow:admin@postgres:5432/talkflow
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16
    container_name: talkflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: talkflow
      POSTGRES_USER: talkflow
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkflow -d talkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: talkflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: