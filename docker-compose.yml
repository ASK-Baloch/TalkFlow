services:
  ai-gateway:
    build:
      context: ./services/ai-gateway

    container_name: talkflow-ai-gateway

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: development

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
        - "127.0.0.1:8000:8000"
        - "127.0.0.1:9019:9019"

    volumes:
        - ./services/ai-gateway/models:/app/models
        - ./services/ai-gateway/app:/app/app
        - ./services/ai-gateway/scripts:/app/scripts
        - ./config:/config
        - ./assets:/app/assets

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: talkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkflow
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: talkflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkflow -d talkflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talkflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  vllm:
    image: vllm/vllm-openai:latest
    container_name: talkflow-vllm
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./services/ai-gateway/models:/app/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - VLLM_USE_V2_MODEL_RUNNER=0
      - PYTHONUNBUFFERED=1
    command: --host 0.0.0.0 --port 8100 --model /app/models/Qwen2.5-1.5B-Instruct-AWQ --served-model-name Qwen/Qwen2.5-1.5B-Instruct-AWQ --dtype auto --quantization awq --max-model-len 2048 --gpu-memory-utilization 0.75
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data: