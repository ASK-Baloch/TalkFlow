services:
  ai-gateway:
    build:
      context: ./services/ai-gateway

    container_name: talkflow-ai-gateway

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: development

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
        - "127.0.0.1:8000:8000"
        - "127.0.0.1:9019:9019"

    volumes:
        - ./services/ai-gateway/models:/app/models
        - ./services/ai-gateway/app:/app/app
        - ./services/ai-gateway/scripts:/app/scripts
        - ./config:/config

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: talkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkflow
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: talkflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkflow -d talkflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talkflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: